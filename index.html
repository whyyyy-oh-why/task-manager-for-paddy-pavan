<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container" role="main">
    <header class="header">
      <h1>My Tasks</h1>
      <button id="themeToggle" class="icon-btn" aria-label="Toggle dark mode">🌙</button>
    </header>

    <form id="taskForm" class="task-form" aria-label="Add new task">
      <input
        id="taskInput"
        type="text"
        class="task-input"
        placeholder="Add a new task…"
        aria-label="New task text"
        maxlength="200"
        autocomplete="off"
        required
      />
      <button type="submit" class="add-btn" aria-label="Add task">Add</button>
    </form>

    <nav class="filters" role="tablist" aria-label="Filter tasks">
      <button class="filter-btn active" data-filter="all" role="tab" aria-selected="true">All</button>
      <button class="filter-btn" data-filter="active" role="tab" aria-selected="false">Active</button>
      <button class="filter-btn" data-filter="completed" role="tab" aria-selected="false">Completed</button>
    </nav>

    <ul id="taskList" class="task-list" aria-label="Task list" aria-live="polite"></ul>

    <div id="emptyState" class="empty-state" hidden aria-live="polite">
      <div class="empty-icon" aria-hidden="true">📋</div>
      <p class="empty-title">No tasks here!</p>
      <p class="empty-sub">Add one above to get started.</p>
    </div>

    <footer class="footer" id="footer" hidden>
      <span id="itemsLeft"></span>
      <button id="clearCompleted" class="text-btn" aria-label="Clear all completed tasks">Clear Completed</button>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
